<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <title>Registo — Luxury Wheels</title>
        <link rel="stylesheet" href="static/css/style.css">
    </head>
    <body>
        <header class="navbar">
            <a href="index.html" class="navbar-logo">Luxury Wheels</a>
            <div class="navbar-botoes"></div>
        </header>

        <div class="pagina-auth">
            <form id="form-registo" class="formulario-auth">
                <h1>Criar conta</h1>

                <div class="campo-filtro">
                    <label for="registo-nome">Nome:</label>
                    <input type="text" id="registo-nome" required>
                </div>

                <div class="campo-filtro">
                    <label for="registo-email">Email:</label>
                    <input type="email" id="registo-email" required>
                </div>

                <div class="campo-filtro">
                    <label for="registo-password">Password:</label>
                    <input type="password" id="registo-password" required>
                </div>

                <div class="campo-filtro">
                    <label for="registo-password-confirm">Confirmar password:</label>
                    <input type="password" id="registo-password-confirm" required>
                </div>

                <div id="registo-erro" class="mensagem-erro"></div>

                <button type="submit">Registar</button>

                <p>Já tem conta? <a href="login.html">Entre aqui</a></p>
            </form>
        </div>

        <script src="static/js/api.js"></script>
        <script src="static/js/navbar.js"></script>
        <script src="static/js/auth.js"></script>
    </body>
</html>
