<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <title>Login — Luxury Wheels</title>
        <link rel="stylesheet" href="static/css/style.css">
    </head>
    <body>
        <header class="navbar">
            <a href="index.html" class="navbar-logo">Luxury Wheels</a>
        </header>

        <div class="pagina-auth">
            <form id="form-login" class="formulario-auth">
                <h1>Entrar na sua conta</h1>

                <div class="campo-filtro">
                    <label for="login-email">Email:</label>
                    <input type="email" id="login-email" required>
                </div>

                <div class="campo-filtro">
                    <label for="login-password">Password:</label>
                    <input type="password" id="login-password" required>
                </div>

                <div id="login-erro" class="mensagem-erro"></div>

                <button type="submit">Entrar</button>

                <p>Ainda não tem conta? <a href="registo.html">Registe-se aqui</a></p>
            </form>
        </div>

        <script src="static/js/api.js"></script>
        <script src="static/js/auth.js"></script>
        <script src="static/js/navbar.js"></script>
    </body>
</html>
