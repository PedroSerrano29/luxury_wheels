<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login - Luxury Wheels</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='images/default.jpg') }}" alt="Logo Luxury Wheels" class="logo">
        </a>
        <h1>Luxury Wheels</h1>
        <div class="auth-buttons">
            <a href="{{ url_for('auth.login') }}">Login</a>
            <a href="{{ url_for('auth.register') }}">Registar-se</a>
        </div>
    </header>
    <div class="login-container">
        <h2>Login</h2>
        <form class="login-form" method="post">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>

            <button type="submit">Entrar</button>
        </form>
        {% if erro %}
            <p style="color: red; text-align: center; margin-top: 10px;">{{ erro }}</p>
        {% endif %}
        <p><a href="{{ url_for('auth.recuperar_password') }}">Esqueceu-se da password?</a></p>
    </div>
</body>
</html>
