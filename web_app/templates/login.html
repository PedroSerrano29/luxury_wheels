<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login - Luxury Wheels</title>
</head>
<body>
    <h2>Login</h2>
    <form method="POST">
        <label>Email:
            <input type="email" name="email" required>
        </label><br>
        <label>Senha:
            <input type="password" name="senha" required>
        </label><br>
        <button type="submit">Entrar</button>
    </form>

    <p><a href="{{ url_for('auth.forgot_password') }}">Esqueceu-se da password?</a></p>
    <p><a href="{{ url_for('auth.register') }}">Ainda não tem conta? Registar-se</a></p>

    <!-- Login Google futuramente -->
    <p>Ou <a href="#">Entrar com Google</a></p>
</body>
</html>
