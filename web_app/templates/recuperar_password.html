<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Password - Luxury Wheels</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='images/default.jpg') }}" alt="Logo Luxury Wheels" class="logo">
        </a>
        <h1>Luxury Wheels</h1>
        <div class="auth-buttons">
            <a href="{{ url_for('auth.login') }}">Login</a>
            <a href="{{ url_for('auth.register') }}">Registar-se</a>
        </div>
    </header>
    <div class="login-container">
        <h2>Recuperar Password</h2>
        <form class="login-form" method="post">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <button type="submit">Enviar Link de Recuperação</button>
        </form>
        <p>Lembrou-se da password? <a href="{{ url_for('auth.login') }}">Voltar ao Login</a></p>
    </div>
</body>
</html>
